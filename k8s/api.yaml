apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      initContainers:
      - name: run-migrations
        image: tradealpha-api:latest
        imagePullPolicy: Never
        command: ["npx", "prisma", "migrate", "deploy"]
        envFrom:
        - configMapRef:
            name: tradealpha-config
        - secretRef:
            name: tradealpha-secrets
      containers:
      - name: api
        image: tradealpha-api:latest
        imagePullPolicy: Never
        command: ["npm", "run", "start:api"]
        ports:
        - containerPort: 4000
        envFrom:
        - configMapRef:
            name: tradealpha-config
        - secretRef:
            name: tradealpha-secrets
        env:
        - name: PORT
          value: "4000"
        livenessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  type: ClusterIP
  ports:
  - port: 4000
    targetPort: 4000
  selector:
    app: api
