global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'tradealpha-api'
    static_configs:
      - targets: ['host.docker.internal:4000']
  - job_name: 'tradealpha-engine'
    static_configs:
      - targets: ['host.docker.internal:4001']
  - job_name: 'tradealpha-workers'
    static_configs:
      - targets: ['host.docker.internal:4002']
  - job_name: 'tradealpha-feed'
    static_configs:
      - targets: ['host.docker.internal:4003']
