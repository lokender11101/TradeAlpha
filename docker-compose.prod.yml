version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: tradealpha
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tradealpha
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run start:api
    environment:
      - DATABASE_URL=postgresql://tradealpha:password@db:5432/tradealpha?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=tradealpha_secret_key_123
      - PORT=4000
    ports:
      - "4000:4000"
    depends_on:
      - db
      - redis

  engine-1:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run start:engine
    environment:
      - DATABASE_URL=postgresql://tradealpha:password@db:5432/tradealpha?schema=public
      - REDIS_URL=redis://redis:6379
      - SYMBOLS_HANDLED=AAPL,MSFT,TSLA
    depends_on:
      - db
      - redis

  engine-2:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run start:engine
    environment:
      - DATABASE_URL=postgresql://tradealpha:password@db:5432/tradealpha?schema=public
      - REDIS_URL=redis://redis:6379
      - SYMBOLS_HANDLED=GOOGL,AMZN
    depends_on:
      - db
      - redis

  workers:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run start:workers
    environment:
      - DATABASE_URL=postgresql://tradealpha:password@db:5432/tradealpha?schema=public
      - REDIS_URL=redis://redis:6379
    depends_on:
      - db
      - redis

  feed:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run start:feed
    environment:
      - DATABASE_URL=postgresql://tradealpha:password@db:5432/tradealpha?schema=public
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:80/api
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web
