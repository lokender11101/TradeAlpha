name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: tradealpha
          POSTGRES_PASSWORD: password
          POSTGRES_DB: tradealpha_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v3
      
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Lint
        run: npm run lint:all
        
      - name: Typecheck
        run: npm run typecheck:all
        
      - name: Database Setup
        run: cd apps/api && npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://tradealpha:password@localhost:5432/tradealpha_test?schema=public

      - name: Test
        run: npm run test:all
        env:
          DATABASE_URL: postgresql://tradealpha:password@localhost:5432/tradealpha_test?schema=public
          REDIS_URL: redis://localhost:6379
